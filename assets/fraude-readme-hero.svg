<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Not Claude. FRAUDE.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2a24"/>
      <stop offset="45%" style="stop-color:#2a1f1c"/>
      <stop offset="100%" style="stop-color:#c4785a"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:#e8a87c;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#e8a87c;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1050" cy="80" r="220" fill="#c4785a" opacity="0.35"/>
  <circle cx="150" cy="520" r="180" fill="#4a3028" opacity="0.5"/>
  <rect x="520" y="175" width="160" height="4" rx="2" fill="#d4a574"/>
  <text x="600" y="280" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-style="italic" fill="#f5f0e8">Not Claude.</text>
  <text x="600" y="380" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="700" fill="#f5f0e8">FRAUDE.</text>
  <text x="600" y="470" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="26" fill="#2a1f1c">Scope-enforced. Still asks first.</text>
